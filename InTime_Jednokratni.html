<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>In Time — Kalkulator cijena</title>
<style>
  :root{--purple:#229891;--purple-dark:#135450;--graphite:#131313;--grey:#6b6b6b;--line:#e2e6ea;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f4f6f8;color:var(--graphite);}
  .btn{display:inline-block;padding:9px 16px;border-radius:8px;border:1px solid var(--purple);background:var(--purple);color:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;}
  .btn:hover{background:var(--purple-dark);border-color:var(--purple-dark);}
  .btn:disabled{opacity:.55;cursor:not-allowed;}
  .btn-outline{background:#fff;color:var(--purple);}
  .btn-outline:hover{background:#eefaf9;color:var(--purple-dark);}
  .btn-small{padding:5px 11px;font-size:12.5px;}
  input[type=text],input[type=password]{width:100%;padding:11px 12px;border:1.5px solid #cfd6dc;border-radius:8px;font-size:15px;font-family:inherit;}
  input[type=text]:focus,input[type=password]:focus{outline:none;border-color:var(--purple);}

  /* ---- Prijava ---- */
  #prijavaView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;position:relative;overflow:hidden;
    background:radial-gradient(1200px 700px at 15% -10%,#0e5f5a 0%,rgba(14,95,90,0) 60%),radial-gradient(900px 600px at 100% 110%,#0b3f6b 0%,rgba(11,63,107,0) 55%),linear-gradient(160deg,#04141a 0%,#071f2a 55%,#050d14 100%);}
  #prijavaView::before,#prijavaView::after{content:"";position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;pointer-events:none;animation:plutaj 14s ease-in-out infinite alternate;}
  #prijavaView::before{width:420px;height:420px;left:-120px;top:8%;background:#16c1b4;}
  #prijavaView::after{width:380px;height:380px;right:-100px;bottom:4%;background:#1f7bd8;animation-delay:-6s;}
  @keyframes plutaj{from{transform:translate(0,0) scale(1);}to{transform:translate(40px,-30px) scale(1.15);}}
  .prijava-kartica{position:relative;z-index:1;width:100%;max-width:780px;background:rgba(10,24,32,.72);border:1px solid rgba(120,220,210,.22);border-radius:22px;
    box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.03) inset,0 0 60px rgba(34,152,145,.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden;text-align:center;}
  .prijava-hero{position:relative;line-height:0;}
  .prijava-slika{display:block;width:100%;height:auto;margin:0;border-radius:0;}
  .prijava-hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(180deg,rgba(10,24,32,0) 0%,rgba(10,24,32,.92) 100%);}
  .prijava-tijelo{padding:4px 34px 30px;margin-top:-18px;position:relative;z-index:2;}
  .prijava-naslov{margin:0 0 6px;font-size:26px;font-weight:800;letter-spacing:.32em;text-transform:uppercase;color:#fff;text-shadow:0 0 22px rgba(34,200,190,.55);}
  .prijava-podnaslov{margin:0 auto 22px;font-size:13.5px;color:#9fb8bf;}
  .prijava-podnaslov::after{content:"";display:block;width:64px;height:3px;margin:14px auto 0;border-radius:3px;background:linear-gradient(90deg,#16c1b4,#1f7bd8);}
  .prijava-forma{max-width:420px;margin:0 auto;}
  .prijava-polje{text-align:left;margin-bottom:14px;}
  .prijava-polje label{display:block;font-size:11px;font-weight:700;color:#7fa3ab;margin-bottom:6px;text-transform:uppercase;letter-spacing:.12em;}
  #prijavaView input[type=text],#prijavaView input[type=password]{background:rgba(255,255,255,.06);color:#fff;border:1.5px solid rgba(160,230,225,.2);border-radius:12px;padding:13px 14px;font-size:15px;transition:border-color .15s,box-shadow .15s,background .15s;}
  #prijavaView input::placeholder{color:#6d8a92;}
  #prijavaView input[type=text]:focus,#prijavaView input[type=password]:focus{outline:none;background:rgba(255,255,255,.09);border-color:#22c8bc;box-shadow:0 0 0 4px rgba(34,200,188,.18),0 0 24px rgba(34,200,188,.25);}
  .prijava-napomena{margin-top:8px;font-size:12px;line-height:1.5;color:#8fb0b8;background:rgba(34,200,188,.08);border:1px solid rgba(34,200,188,.2);border-radius:10px;padding:8px 11px;}
  .prijava-napomena strong,.prijava-napomena em{color:#d6f3f0;font-style:normal;}
  .prijava-napomena em{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;}
  .prijava-gumb{width:100%;padding:14px;font-size:15px;letter-spacing:.12em;text-transform:uppercase;margin-top:6px;border:0;border-radius:12px;color:#fff;
    background:linear-gradient(135deg,#16c1b4 0%,#1b8f9a 50%,#1f6fd0 100%);box-shadow:0 10px 28px rgba(22,193,180,.35);transition:transform .15s,box-shadow .15s,filter .15s;}
  .prijava-gumb:hover{background:linear-gradient(135deg,#1ad6c8 0%,#1fa3ae 50%,#2a82ea 100%);transform:translateY(-2px);box-shadow:0 14px 34px rgba(22,193,180,.5);}
  .prijava-gumb:active{transform:translateY(0);}
  .prijava-status{min-height:20px;margin-top:12px;font-size:13px;color:#9fb8bf;}
  .prijava-status.greska{color:#ff7b6e;font-weight:700;}
  .prijava-podnozje{margin-top:18px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#587780;}
  @media (max-width:600px){.prijava-tijelo{padding:2px 20px 24px;}.prijava-naslov{font-size:20px;letter-spacing:.22em;}}

  /* ---- Aplikacija ---- */
  #appView{display:none;padding:14px 18px 30px;}
  .app-traka{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
  .app-traka .app-logo{height:34px;width:auto;border-radius:6px;}
  .app-traka h1{margin:0;font-size:18px;color:var(--purple-dark);}
  .app-korisnik{margin-left:auto;font-size:13px;color:var(--grey);}
  .faq-admin-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
  .faq-admin-card h3{margin:0 0 6px;font-size:16px;}
  .faq-admin-hint{font-size:12.5px;color:var(--grey);line-height:1.5;margin:0 0 10px;}
  .faq-admin-card-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  /* ---- KALKULACIJE (isti izgled kao u adminu) ---- */
    .kalk-usporedba-grid{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;}
  .kalk-usporedba-slot{flex:0 0 480px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fafafa;}
  .kalk-usporedba-slot-naslov{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;color:var(--graphite);}
  .kalk-usporedba-cjenik-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;margin-bottom:8px;background:#fdecea;border:2px solid #c0392b;border-radius:8px;}
  .kalk-usporedba-cjenik-bar input[type=file]{font-size:12px;max-width:100%;flex:1 1 200px;}
  .af-poslano-bedz{margin-left:auto;margin-right:8px;font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:12px;background:#eceff1;color:#78909c;white-space:nowrap;}
  .af-poslano-bedz.ok{background:#e6f4ea;color:#1e8449;}
  .kalk-usporedba-arhiva-info{flex:1 1 100%;font-size:11.5px;font-weight:700;color:#1e8449;}
  .kalk-arh-panel{margin:-2px 0 8px;padding:8px 10px;border:2px solid #229891;border-radius:8px;background:#f2fbfa;}
  .kalk-arh-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px;font-size:12.5px;}
  .kalk-arh-red{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 0;border-top:1px solid #cfe8e6;}
  .kalk-arh-red .kalk-arh-tekst{flex:1 1 180px;min-width:0;}
  .kalk-arh-red .kalk-arh-naziv{font-weight:800;font-size:13px;word-break:break-word;}
  .kalk-arh-red .kalk-arh-meta{font-size:11px;color:#666;word-break:break-word;}
  .kalk-arh-prazno{font-size:12px;color:#666;padding:6px 0;}
  .kalk-arh-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100000;display:flex;align-items:center;justify-content:center;padding:16px;}
  .kalk-arh-modal{background:#fff;border-radius:12px;padding:18px 20px;max-width:460px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.4);}
  .kalk-arh-modal h4{margin:0 0 6px;font-size:16px;}
  .kalk-arh-modal input[type=text]{width:100%;box-sizing:border-box;margin:6px 0 12px;}
  .kalk-arh-modal .kalk-arh-akcije{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
  .kalk-usporedba-cjenik-status{flex:1 1 100%;font-size:11.5px;color:var(--graphite);line-height:1.35;word-break:break-word;}
  .kalk-usporedba-iframe{width:100%;height:1500px;border:1px solid var(--line);border-radius:8px;display:block;background:#fff;}
  /* Prošireni prikaz (cijela stranica) — ista kartica, samo position:fixed; iframeovi se NE ponovno stvaraju pa ostaju učitani cjenici i uneseni podaci. */
  .kalk-usporedba-fs{position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:#fff;overflow:auto;padding:14px 18px;border-radius:0;margin:0;box-sizing:border-box;}
  .kalk-usporedba-fs .kalk-usporedba-grid{overflow-x:auto;}
  .kalk-usporedba-fs .kalk-usporedba-slot{flex:1 1 0;min-width:420px;}
  .kalk-usporedba-fs .kalk-usporedba-iframe{height:calc(100vh - 170px);min-height:700px;}
  .kalk-usporedba-fs .faq-admin-hint{display:none;}
  body.kalk-usporedba-fs-open{overflow:hidden;}
  .kalk-arh-modal-bg{display:none;}
  .jed-sazetak{margin:0 0 12px;padding:12px 16px;border-radius:10px;font-size:15px;font-weight:700;line-height:1.5;display:none;}
  .jed-sazetak.bolje{display:block;background:#e6f4ea;border:2px solid #1e8449;color:#145a32;}
  .jed-sazetak.lose{display:block;background:#fdecea;border:2px solid #c0392b;color:#8e2a1f;}
  .jed-sazetak.isto{display:block;background:#fff7e0;border:2px solid #f2b600;color:#5b4300;}
  .jed-istek{font-size:12.5px;color:var(--grey);margin:0 0 10px;}
  @media (max-width:900px){.kalk-usporedba-grid{flex-direction:column;overflow-x:visible;}.kalk-usporedba-slot{flex:1 1 auto;}.app-korisnik{margin-left:0;}}
</style>

<script type="text/javascript">

  function baner() {

    b.innerHTML = '<div style="margin-bottom:10px;">Ova stranica koristi <b>Microsoft Clarity</b> za anonimnu analizu korištenja (kretanje i klikovi po stranici) kako bismo poboljšali našu uslugu. Smijemo li? Odabir se pamti na ovom uređaju.</div>' +

    document.body.appendChild(b);
    b.querySelector('#cl-da').onclick = function() { spremi('da'); b.remove(); ucitaj(); };
    b.querySelector('#cl-ne').onclick = function() { spremi('ne'); b.remove(); ceka = []; };
  }
  if (privola === 'da') { ucitaj(); }
  else if (privola !== 'ne') {

<body>

<div id="prijavaView">
  <div class="prijava-kartica">
    <div class="prijava-hero"><img class="prijava-slika" src="https://i.imgur.com/pedfVN3.png" alt="In Time"></div>
    <div class="prijava-tijelo">
      <h1 class="prijava-naslov">Kalkulator cijena</h1>
      <p class="prijava-podnaslov">Prijavite se podacima iz našeg e-maila.</p>
      <form id="prijavaForma" class="prijava-forma" autocomplete="on">
        <div class="prijava-polje"><label for="prijavaUser">Korisničko ime</label><input type="text" id="prijavaUser" name="username" autocomplete="username" placeholder="vaša e-mail adresa" autocapitalize="none" spellcheck="false"></div>
        <div class="prijava-polje"><label for="prijavaPass">Lozinka</label><input type="password" id="prijavaPass" name="password" autocomplete="current-password" placeholder="••••••••"></div>
        <button type="submit" class="btn prijava-gumb" id="prijavaGumb">Prijava</button>
        <div class="prijava-status" id="prijavaStatus"></div>
      </form>
      <div class="prijava-podnozje">In Time d.o.o. · Licensee of FedEx</div>
    </div>
  </div>
</div>

<div id="appView">
  <div class="app-traka">
    <h1>In Time — Kalkulator cijena</h1>
    <div class="app-korisnik"><span id="appKorisnik"></span> <button type="button" class="btn btn-outline btn-small" id="odjavaGumb">Odjava</button></div>
  </div>
  <div id="probniTraka" style="display:none;background:#ff8a00;color:#fff;font-weight:700;text-align:center;padding:9px 14px;font-size:14px;">🧪 PROBNI NAČIN — ovako kalkulator vidi primatelj. Ništa se ne bilježi i ne računa u praćenje.</div>
  <div id="panelMjesto"></div>
</div>

<script>
var GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz73zkx72GhrDZ-t3CamF5wuz-9V7Uxe5z9IkFxHA8F5FBlrIlc7zMUd4_EHTILD9FTAw/exec";
var ipCache_ = ''; // javna IP adresa (dohvaća se jednom; kasnije se ne čeka na mrežu dok kalkulatori opterećuju preglednik)
function osvjeziIp_() { return dohvatiIP_().then(function(ip) { if (ip) { ipCache_ = ip; } return ip; }); }

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
}

function gasCall(payload) {
  return fetch(GAS_WEB_APP_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  }).then(function(res) { return res.json(); });
}

// Javna IP adresa preglednika (Apps Script je ne vidi) — čisto informativno, kratak timeout.
function dohvatiIP_() {
  var kontroler = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var timeoutId = kontroler ? setTimeout(function() { kontroler.abort(); }, 3000) : null;
  return fetch('https://api.ipify.org?format=json', kontroler ? { signal: kontroler.signal } : {})
    .then(function(res) { return res.json(); })
    .then(function(data) { return (data && data.ip) ? String(data.ip) : ''; })
    .catch(function() { return ''; })
    .then(function(ip) { if (timeoutId) { clearTimeout(timeoutId); } return ip; });
}

function spremiSesiju_(s) { try { sessionStorage.setItem('jedSesija', JSON.stringify(s)); } catch (e) { /* nije dostupno */ } }
function ucitajSesiju_() { try { var r = sessionStorage.getItem('jedSesija'); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
function obrisiSesiju_() { try { sessionStorage.removeItem('jedSesija'); } catch (e) { /* nije dostupno */ } }

var jedSesija_ = null; // { token, naziv, ime, prezime, istek, kalkulatori:[{slot,tip,oznaka}] }
var jedHeartbeat_ = null;

function statusPrijave_(tekst, greska) {
  var el = document.getElementById('prijavaStatus');
  el.textContent = tekst || '';
  el.className = 'prijava-status' + (greska ? ' greska' : '');
}

function prikaziApp_() {
  document.getElementById('prijavaView').style.display = 'none';
  document.getElementById('appView').style.display = 'block';
  if (!ipCache_) { osvjeziIp_(); }
  document.getElementById('appKorisnik').textContent = jedSesija_.naziv || '';
  try { intimeClarityOznaci(jedSesija_.naziv, '', 'jednokratni kalkulator'); } catch (eCl) { /* analitika nije kritična */ }
  var pb = document.getElementById('probniTraka');
  if (pb) { pb.style.display = jedSesija_.probni ? 'block' : 'none'; }
  var mjesto = document.getElementById('panelMjesto');
  mjesto.innerHTML = '';
  mjesto.appendChild(buildJedPanel_());
  if (jedHeartbeat_) { clearInterval(jedHeartbeat_); }
  jedHeartbeat_ = setInterval(provjeriSesiju_, 60000);
}

function prikaziPrijavu_(poruka) {
  if (jedHeartbeat_) { clearInterval(jedHeartbeat_); jedHeartbeat_ = null; }
  document.getElementById('appView').style.display = 'none';
  document.getElementById('prijavaView').style.display = 'flex';
  document.getElementById('panelMjesto').innerHTML = ''; // uklanja i iframeove
  document.body.classList.remove('kalk-usporedba-fs-open');
  document.getElementById('prijavaPass').value = '';
  statusPrijave_(poruka || '', !!poruka);
}

// Server gasi pristup (istek / admin / ponuda) — provjera svake minute i kad se vratimo na karticu.
function provjeriSesiju_() {
  if (!jedSesija_) { return; }
  gasCall({ action: 'jedToken', token: jedSesija_.token }).then(function(res) {
    if (res && res.status === 'error') { jedSesija_ = null; obrisiSesiju_(); prikaziPrijavu_(res.message || 'Pristup više nije dostupan.'); }
  }).catch(function() { /* privremena greška mreže — ne odjavljuj */ });
}
document.addEventListener('visibilitychange', function() { if (!document.hidden) { provjeriSesiju_(); } });

document.getElementById('prijavaForma').addEventListener('submit', function(ev) {
  ev.preventDefault();
  var u = document.getElementById('prijavaUser').value.trim();
  var p = document.getElementById('prijavaPass').value;
  if (!u || !p) { statusPrijave_('Unesite korisničko ime i lozinku.', true); return; }
  var gumb = document.getElementById('prijavaGumb');
  gumb.disabled = true;
  statusPrijave_('Prijava…', false);
  osvjeziIp_().then(function(ip) {
    return gasCall({ action: 'jedPrijava', username: u, lozinka: p, ipAdresa: ip });
  }).then(function(res) {
    gumb.disabled = false;
    if (!res || res.status !== 'ok') { statusPrijave_((res && res.message) || 'Prijava nije uspjela.', true); return; }
    jedSesija_ = { token: res.token, naziv: res.naziv, ime: res.ime, prezime: res.prezime, istek: res.istek, kalkulatori: res.kalkulatori || [] };
    spremiSesiju_(jedSesija_);
    statusPrijave_('', false);
    prikaziApp_();
  }).catch(function() {
    gumb.disabled = false;
    statusPrijave_('Greška u komunikaciji s poslužiteljem.', true);
  });
});

document.getElementById('odjavaGumb').addEventListener('click', function() {
  jedSesija_ = null;
  obrisiSesiju_();
  prikaziPrijavu_('');
});

// ---------- KALKULATOR(I): 1 (novi klijent) ili 2 (revizija: stari + novi uvjeti, uz usporedbu) ----------
  function buildJedPanel_() {
    var wrap = document.createElement('div');
    wrap.className = 'faq-admin-card';
    var kalkulatori_ = jedSesija_.kalkulatori || [];

    function ownText_(el) {

    }
    function fmtBr_(n, minDec, maxDec) { return n.toLocaleString('hr-HR', { minimumFractionDigits: minDec, maximumFractionDigits: maxDec }); }
    function znak_(n) { return n > 0 ? '+' : '−'; }
    function ukloniDev_(el) {

      if (Math.abs(d) < 0.005) { ukloniDev_(el); el.classList.add('kalk-isto'); return; }
      el.classList.remove('kalk-isto');
      var dijelovi = [];
      if (val.jed === 'EUR') {

        if ((opcije.pct || opcije.samoPct) && ref.v > 0) {

      if (!dijelovi.length) { ukloniDev_(el); return; }

    function ocistiSveDev_(doc) {

      Array.prototype.forEach.call(doc.querySelectorAll('.kalk-isto'), function(n) { n.classList.remove('kalk-isto'); });
    }
    function kljucRetka_(tr, brojac) {

          if (zeljeni !== postojeci) {

      });

    kalkulatori_.forEach(function(k, i) { dodajSlot_(k, i === 0); });

// ---------- Pokretanje: nastavi postojeću sesiju (isti tab) ako je još važeća ----------
